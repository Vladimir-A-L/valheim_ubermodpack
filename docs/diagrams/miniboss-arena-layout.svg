<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="650" viewBox="0 0 1040 650"
     role="img" aria-labelledby="title description">
  <title id="title">Схема отдельной арены мини-босса</title>
  <desc id="description">Прямой подход из шести сегментов ведёт к двери. За дверью широкий Г-образный
    предбанник скрывает центр ровного зала. Низкие постаменты стоят у стен вне маршрута босса.
    За шестым сегментом добавлен переход с защитной заглушкой.
    Схема не в масштабе; пять сегментов отсчитываются по пути от двери.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6" fill="none" stroke="#047857" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="1040" height="650" fill="#ffffff"/>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#17212f">
    <text x="32" y="35" font-size="22" font-weight="bold">Арена мини-босса · кандидат 0.12.1</text>
    <text x="32" y="60" font-size="14" fill="#475569">
      Без масштаба. Зал 24×20 м; потолок 6 м; коридор и сегмент — по 4 м.</text>
    <path d="M40 370 H220 V220 H440 V90 H990 V430 H440 V460 H220 V430 H40 Z"
          fill="#f1f5f9" stroke="#334155" stroke-width="8"/>
    <rect x="8" y="370" width="32" height="60" fill="#fef3c7" stroke="#334155" stroke-width="3"/>
    <path d="M8 370 V430" stroke="#334155" stroke-width="7"/>
    <path d="M40 375 V425" stroke="#f1f5f9" stroke-width="10"/>
    <path d="M220 220 H340 V340 H220 Z" fill="#64748b" stroke="#334155" stroke-width="6"/>
    <path d="M440 90 V220 M440 300 V430" stroke="#334155" stroke-width="8"/>
    <path d="M70 373 V427 M100 373 V427 M130 373 V427 M160 373 V427 M190 373 V427"
          stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M220 369 V431" stroke="#92400e" stroke-width="7"/>
    <path d="M220 370 L253 397" stroke="#d97706" stroke-width="3" stroke-dasharray="5 4"/>
    <path d="M70 354 V445" stroke="#be123c" stroke-width="2" stroke-dasharray="6 5"/>
    <g font-size="12" text-anchor="middle" fill="#475569">
      <text x="55" y="415">6</text><text x="85" y="415">5</text>
      <text x="115" y="415">4</text><text x="145" y="415">3</text>
      <text x="175" y="415">2</text><text x="205" y="415">1</text>
    </g>
    <g fill="#e2e8f0" stroke="#94a3b8" stroke-width="2">
      <rect x="490" y="106" width="60" height="30" rx="4"/>
      <rect x="660" y="106" width="60" height="30" rx="4"/>
      <rect x="830" y="106" width="60" height="30" rx="4"/>
      <rect x="490" y="384" width="60" height="30" rx="4"/>
      <rect x="660" y="384" width="60" height="30" rx="4"/>
      <rect x="830" y="384" width="60" height="30" rx="4"/>
    </g>
    <g fill="#d97706" stroke="#92400e" stroke-width="1.5">
      <circle cx="520" cy="121" r="6"/><circle cx="690" cy="121" r="6"/>
      <circle cx="860" cy="121" r="6"/><circle cx="520" cy="399" r="6"/>
      <circle cx="690" cy="399" r="6"/><circle cx="860" cy="399" r="6"/>
    </g>
    <circle cx="700" cy="255" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <path d="M700 250 V237 L694 244 M700 237 L706 244" fill="none" stroke="#2563eb" stroke-width="2"/>
    <text x="700" y="315" text-anchor="middle" font-size="18">Центр и точка возврата</text>
    <text x="700" y="341" text-anchor="middle" font-size="14">Ровный свободный зал</text>
    <text x="700" y="166" text-anchor="middle" font-size="14">Постаменты и случайные ценности у стен</text>
    <path d="M668 255 H390 V400 H270" fill="none" stroke="#047857" stroke-width="3"
          stroke-dasharray="9 6" marker-end="url(#arrow)"/>
    <circle cx="270" cy="400" r="10" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
    <path d="M260 393 H234" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M220 400 L440 334" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 5"/>
    <path d="M433 327 L447 341 M447 327 L433 341" stroke="#b91c1c" stroke-width="3"/>
    <text x="50" y="330" font-size="14">Подход без ниш</text>
    <text x="250" y="295" font-size="14" fill="#ffffff">Стена</text>
    <text x="265" y="485" font-size="14">Г-образный предбанник входит в арену</text>
    <text x="265" y="509" font-size="14">Высота потолка совпадает с залом</text>
    <path d="M70 448 V481 H40" fill="none" stroke="#be123c" stroke-width="1.5"/>
    <text x="32" y="503" font-size="13" fill="#9f1239">5 сегментов от двери</text>
    <text x="32" y="522" font-size="12" fill="#475569">Граница продолжения боя</text>
    <path d="M220 433 V548" stroke="#92400e" stroke-width="1.5"/>
    <text x="172" y="570" font-size="14" fill="#92400e">Усиленный урон по двери</text>
    <text x="172" y="589" font-size="13" fill="#92400e">без гарантии числа попаданий</text>
    <text x="650" y="485" font-size="14" fill="#047857">Пунктир — путь к позиции броска</text>
    <text x="650" y="509" font-size="14" fill="#b91c1c">Стена скрывает центр от двери</text>
    <text x="650" y="550" font-size="14">Босс остаётся за порогом двери.</text>
    <text x="650" y="574" font-size="14">Босс проходит весь изгиб предбанника.</text>
    <text x="32" y="629" font-size="13" fill="#475569">
      Слева переход 4 м: стык 2×2,4 м на уровне пола, заглушка до подключения штатной комнаты.
    </text>
  </g>
</svg>
